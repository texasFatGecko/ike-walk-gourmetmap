<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 検索エンジンに載せない（リンクを知っている人だけで使うため） -->
  <meta name="robots" content="noindex, nofollow">
  <title>いけ散歩グルメマップ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap&text=%E3%81%84%E3%81%91%E6%95%A3%E6%AD%A9%E3%82%B0%E3%83%AB%E3%83%A1%E3%83%9E%E3%83%83%E3%83%97">
  <link rel="stylesheet" href="style.css?v=2026.1018.02">
</head>
<body>
  <div class="app">
    <aside class="side">
      <header class="side-head">
        <h1>いけ散歩<span class="accent">グルメ</span>マップ</h1>
        <p class="mode" id="mode"></p>
      </header>

      <div class="tools">
        <input id="q" type="search" placeholder="店名・メモ・住所などで絞り込み" aria-label="キーワードで絞り込み">
        <button id="add-btn" class="btn primary" type="button">＋ お店を追加</button>
      </div>
      <div class="filters">
        <select id="genre-filter" aria-label="ジャンルで絞り込み">
          <option value="">すべてのジャンル</option>
        </select>
        <label class="filter-opt"><input id="hide-visited" type="checkbox"> 訪問済みを隠す</label>
      </div>

      <p class="count" id="count"></p>
      <ul class="list" id="list"></ul>
      <p class="empty" id="empty" hidden>まだお店がありません。「＋ お店を追加」から登録してください。</p>
      <!-- 公開のたびにここと、?v= の番号を同じ値に更新する -->
      <p class="version">ver 2026.1018.02</p>
    </aside>

    <main class="map-wrap">
      <div id="map"></div>
      <div class="pick-banner" id="pick-banner" hidden>地図をクリックしてお店の位置を決めてください</div>
      <details class="legend" id="legend">
        <summary>ジャンルの目安</summary>
        <ul id="legend-list"></ul>
      </details>
    </main>
  </div>

  <dialog id="dlg">
    <form id="form" method="dialog">
      <h2 id="dlg-title">お店を追加</h2>
      <label><span>店名 <span class="req">必須</span></span>
        <input id="f-name" name="name" required maxlength="80">
      </label>
      <label>ジャンル
        <select id="f-genre" name="genre">
          <option value="">選んでください</option>
        </select>
        <span class="hint" id="genre-hint"></span>
      </label>
      <label>住所
        <div class="row">
          <input id="f-address" name="address" maxlength="200" placeholder="住所や店名で位置を検索">
          <button id="geo-btn" class="btn" type="button">位置を検索</button>
        </div>
      </label>
      <div class="loc">
        <span id="loc-text">位置：未設定</span>
        <button id="pick-btn" class="btn ghost" type="button">地図で指定</button>
      </div>
      <ul class="geo-results" id="geo-results"></ul>
      <label>メモ
        <textarea id="f-memo" name="memo" rows="3" maxlength="500" placeholder="おすすめメニュー、予約のコツなど"></textarea>
      </label>
      <label>URL
        <input id="f-url" name="url" type="url" maxlength="300" placeholder="https://">
      </label>
      <div class="visit-row">
        <label class="check"><input id="f-visited" type="checkbox"> 訪問済み</label>
        <label class="check">訪問日 <input id="f-visited-at" type="date"></label>
      </div>
      <label>記入者名
        <input id="f-author" name="author" maxlength="30" placeholder="ニックネームでOK">
      </label>
      <p class="err" id="err" hidden></p>
      <div class="actions">
        <button id="del-btn" class="btn danger" type="button" hidden>削除</button>
        <span class="spacer"></span>
        <button id="cancel-btn" class="btn" type="button">キャンセル</button>
        <button id="save-btn" class="btn primary" type="submit">保存</button>
      </div>
    </form>
  </dialog>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="config.js?v=2026.1018.02"></script>
  <script src="app.js?v=2026.1018.02"></script>
</body>
</html>
